version: "2"
linters:
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - dupword
    - errorlint
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - nosprintfhostport
    - prealloc
    - revive
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - usetesting
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        default:
          allow:
            - $gostd
            - github.com/multiplay/go-ts3
            - github.com/mitchellh/mapstructure
            - golang.org/x/crypto/ssh
            - github.com/stretchr/testify
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - gosec
        text: "G101:"
      - path: server_cmds\.go
        linters:
          - gosec
        text: "G117:"
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
